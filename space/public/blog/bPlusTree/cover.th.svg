<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="B+ 树结构示意图">
  <defs>
    <linearGradient id="bptBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="55%" stop-color="#ffe9d6"/>
      <stop offset="100%" stop-color="#ffd6e2"/>
    </linearGradient>
    <marker id="bptCoverArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e08a3c"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="url(#bptBg)"/>
  <circle cx="700" cy="80" r="120" fill="#ffb3c9" opacity="0.28"/>
  <circle cx="90" cy="520" r="140" fill="#ffcf9e" opacity="0.3"/>

  <text x="400" y="62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#9c4f16">B+ Tree</text>

  <g stroke="#d8944f" stroke-width="2.4" fill="none">
    <line x1="400" y1="160" x2="200" y2="228"/>
    <line x1="400" y1="160" x2="600" y2="228"/>
    <line x1="200" y1="300" x2="110" y2="368"/>
    <line x1="200" y1="300" x2="290" y2="368"/>
    <line x1="600" y1="300" x2="500" y2="368"/>
    <line x1="600" y1="300" x2="700" y2="368"/>
  </g>

  <g font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" text-anchor="middle">
    <!-- root -->
    <g>
      <rect x="345" y="104" width="110" height="56" rx="12" fill="#ffffff" stroke="#e79b52" stroke-width="2.4"/>
      <rect x="365" y="118" width="70" height="28" rx="6" fill="#fff2e2" stroke="#e79b52"/>
      <text x="400" y="138" fill="#8a4a12">20</text>
    </g>

    <!-- internal nodes -->
    <g>
      <rect x="145" y="244" width="110" height="56" rx="12" fill="#ffffff" stroke="#e79b52" stroke-width="2.2"/>
      <rect x="165" y="258" width="70" height="28" rx="6" fill="#fff2e2" stroke="#e79b52"/>
      <text x="200" y="278" fill="#8a4a12">10</text>
    </g>
    <g>
      <rect x="545" y="244" width="110" height="56" rx="12" fill="#ffffff" stroke="#e79b52" stroke-width="2.2"/>
      <rect x="565" y="258" width="70" height="28" rx="6" fill="#fff2e2" stroke="#e79b52"/>
      <text x="600" y="278" fill="#8a4a12">40</text>
    </g>

    <!-- leaves -->
    <g>
      <rect x="45" y="384" width="130" height="56" rx="12" fill="#ffffff" stroke="#e79b52" stroke-width="2"/>
      <rect x="57" y="398" width="50" height="28" rx="6" fill="#fff2e2" stroke="#e79b52"/>
      <rect x="113" y="398" width="50" height="28" rx="6" fill="#fff2e2" stroke="#e79b52"/>
      <text x="82" y="418" fill="#8a4a12">5</text>
      <text x="138" y="418" fill="#8a4a12">8</text>
    </g>
    <g>
      <rect x="225" y="384" width="130" height="56" rx="12" fill="#ffffff" stroke="#e79b52" stroke-width="2"/>
      <rect x="237" y="398" width="50" height="28" rx="6" fill="#fff2e2" stroke="#e79b52"/>
      <rect x="293" y="398" width="50" height="28" rx="6" fill="#fff2e2" stroke="#e79b52"/>
      <text x="262" y="418" fill="#8a4a12">12</text>
      <text x="318" y="418" fill="#8a4a12">18</text>
    </g>
    <g>
      <rect x="435" y="384" width="130" height="56" rx="12" fill="#ffffff" stroke="#e79b52" stroke-width="2"/>
      <rect x="447" y="398" width="50" height="28" rx="6" fill="#fff2e2" stroke="#e79b52"/>
      <rect x="503" y="398" width="50" height="28" rx="6" fill="#fff2e2" stroke="#e79b52"/>
      <text x="472" y="418" fill="#8a4a12">25</text>
      <text x="528" y="418" fill="#8a4a12">35</text>
    </g>
    <g>
      <rect x="635" y="384" width="130" height="56" rx="12" fill="#ffffff" stroke="#e79b52" stroke-width="2"/>
      <rect x="647" y="398" width="50" height="28" rx="6" fill="#fff2e2" stroke="#e79b52"/>
      <rect x="703" y="398" width="50" height="28" rx="6" fill="#fff2e2" stroke="#e79b52"/>
      <text x="672" y="418" fill="#8a4a12">50</text>
      <text x="728" y="418" fill="#8a4a12">70</text>
    </g>
  </g>

  <!-- leaf sibling pointers -->
  <g stroke="#e08a3c" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#bptCoverArrow)">
    <line x1="175" y1="412" x2="219" y2="412"/>
    <line x1="355" y1="412" x2="429" y2="412"/>
    <line x1="565" y1="412" x2="629" y2="412"/>
  </g>

  <text x="400" y="510" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#a8692c" opacity="0.9">有序 · 平衡 · 叶子成链</text>
  <text x="400" y="546" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#b98a5c" opacity="0.85">查找 · 插入分裂 · 删除合并</text>
</svg>
